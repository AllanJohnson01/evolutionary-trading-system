[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-trader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["alpaca-py>=0.33.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
